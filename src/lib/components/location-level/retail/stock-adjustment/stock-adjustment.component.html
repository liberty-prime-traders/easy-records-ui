<div class="flex flex-column gap-2" id="stock-adjustment" esrAutoStretch="stock-adjustment">
  <div class="flex align-items-center justify-content-between">
    <span class="font-bold">Stock Adjustments</span>
    @if (formIsVisible()) {
      <button pButton (click)="formIsVisible.set(false)" severity="secondary">
        <i class="pi pi-arrow-left"></i>
        Back to Stock Adjustments
      </button>
    } @else {
      <button pButton (click)="formIsVisible.set(true)"><i class="pi pi-plus"></i> New Adjustment</button>
    }
  </div>

  @if (formIsVisible()) {
    <p-divider class="m-0"/>
    <esr-location-stock-adjustment-form (stockAdjustmentSaved)="onStockAdjustmentSaved()"/>
  } @else {
    <div class="flex pt-3 gap-3">
      <esr-stock-adjustment-filter class="w-15rem"/>

      <p-divider layout="vertical"/>

      <div class="flex-grow-1">
        <esr-location-stock-adjustment-grid/>
      </div>
    </div>
  }

  <esr-error-summary class="floating bottom left" [regularErrorMessages]="failureMessages()"/>
</div>
