<esr-loading-container [loading]="sessionIsLoading()">

  @if (showUnsavedCarts()) {
    <esr-open-sale-sessions />

  } @else {
    <div class="flex flex-column" id="sale-form" esrAutoStretch="sale-form" [padding]="0">
      <esr-sale-form-header/>

      <div class="flex flex-grow-1">
        <div class="flex flex-column flex-grow-1 pt-3">
          <esr-form-field label="Customer" class="pl-3">
            @if (canEditCustomer()) {
              <div class="flex gap-2">
                <p-select
                  [options]="customers()"
                  optionLabel="fullName"
                  optionValue="id"
                  [filter]="true"
                  class="flex-grow-1"
                  (onChange)="onCustomerChange()"
                  [formField]="saleForm.contactId"
                  placeholder="Select a Customer">
                </p-select>

                <p-toggle-button
                  onLabel="Walk-In"
                  offLabel="Walk-In"
                  (onChange)="respondToWalkInCustomer($event.checked)"
                  [formField]="saleForm.walkInCustomer">
                </p-toggle-button>
              </div>

            } @else {
              {{ saleSession().contactLabel | nullSafe }}
            }
          </esr-form-field>

          @if (canAddProducts()) {
            <esr-available-product-lookup
              class="px-3"
              (productSelected)="sendLineRequest($event)"
              [selectedProductIds]="selectedProductIds()">
            </esr-available-product-lookup>
          }

          <esr-sale-form-tabs class="flex-grow-1"/>
        </div>

        @if (isPendingConsolidation()) {
          <esr-sale-consolidation-panel class="col-3 p-0"/>
        } @else {
          <esr-sale-form-summary class="col-3 p-0"/>
        }
      </div>
    </div>
  }

</esr-loading-container>
