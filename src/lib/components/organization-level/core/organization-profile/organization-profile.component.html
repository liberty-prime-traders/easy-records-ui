<h3>Organization Profile</h3>

<p-divider/>

<form [formGroup]="organizationForm" class="mt-2">
  <esr-form-field for="name" label="Name" [required]="true" contentClass="col-8">
    <input id="name" pInputText formControlName="name"/>
  </esr-form-field>

  <esr-form-field for="description" label="Description" contentClass="col-8">
    <textarea id="description" pInputText formControlName="description" class="w-full"></textarea>
  </esr-form-field>

  <div class="flex justify-content-end col-6 p-0">
    <esr-forms-buttons [disableReset]="!organizationForm.dirty"
                       [disableSave]="!organizationForm.valid || !organizationForm.dirty"
                       [hideReset]="true"
                       [hideDelete]="true"
                       [processingStatus]="organizationProcessingStatus()"
                       [failureMessages]="organizationServiceFailureMessages()"
                       [saveLabel]="'Update'"
                       (save)="updateOrganization()"
                       (resetAction)="organizationForm.reset()">
    </esr-forms-buttons>
  </div>
</form>

<esr-admin-data-fixes/>
