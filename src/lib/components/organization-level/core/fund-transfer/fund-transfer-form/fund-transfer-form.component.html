<div id="fund-transfer-form">
  <div class="flex flex-column gap-2 filled-background" >
    <esr-form-field [required]="true" label="Type" for="type">
      <p-select id="type"
                class="flex-grow-1"
                optionLabel="label"
                optionValue="value"
                [options]="FundMovementType | enumToDropdown"
                [formField]="fundTransferForm.type">
      </p-select>
    </esr-form-field>

    <esr-loading-container [loading]="accountTreesLoading()">
      @if (isTransfer()) {
        <esr-form-field [required]="true" label="From Account" for="fromAccount">
          <p-tree-select id="fromAccount"
                         class="flex-grow-1"
                         appendTo="body"
                         placeholder="Select an Account"
                         [options]="fundMovementTrees()"
                         [ngModel]="fromAccount()"
                         (ngModelChange)="onFromAccountChange($event)">
          </p-tree-select>
        </esr-form-field>

        <esr-form-field [required]="true" label="To Account" for="toAccount">
          <p-tree-select id="toAccount"
                         class="flex-grow-1"
                         appendTo="body"
                         placeholder="Select an Account"
                         [options]="fundMovementTrees()"
                         [ngModel]="toAccount()"
                         (ngModelChange)="onToAccountChange($event)">
          </p-tree-select>
        </esr-form-field>
      } @else {
        <esr-form-field [required]="true" [label]="accountLabel()" for="account">
          <p-tree-select id="account"
                         class="flex-grow-1"
                         appendTo="body"
                         placeholder="Select an Account"
                         [options]="fundMovementTrees()"
                         [ngModel]="account()"
                         (ngModelChange)="onAccountChange($event)">
          </p-tree-select>
        </esr-form-field>
      }
    </esr-loading-container>

    <esr-form-field [required]="true" label="Amount" for="amount">
      <p-input-number inputId="amount"
                      mode="currency"
                      currency="KES"
                      class="flex-grow-1"
                      [min]="0"
                      [formField]="fundTransferForm.amount">
      </p-input-number>
    </esr-form-field>

    <esr-form-field [required]="true" label="Date" for="movementDate">
      <p-date-picker inputId="movementDate"
                     class="flex-grow-1"
                     appendTo="body"
                     [showIcon]="true"
                     [maxDate]="today"
                     [formField]="fundTransferForm.movementDate">
      </p-date-picker>
    </esr-form-field>

    <esr-form-field label="Note" for="note">
      <input id="note" class="flex-grow-1" pInputText [formField]="fundTransferForm.note"/>
    </esr-form-field>

    <esr-forms-buttons [disableReset]="!fundTransferForm().dirty()"
                       [disableSave]="fundTransferForm().invalid() || !fundTransferForm().dirty()"
                       [hideDelete]="true"
                       [signalForm]="fundTransferForm()"
                       [fieldMap]="fieldMap"
                       [processingStatus]="processingStatus()"
                       [failureMessages]="failureMessages()"
                       (save)="save()"
                       (resetAction)="resetForm()">
    </esr-forms-buttons>
  </div>
</div>
