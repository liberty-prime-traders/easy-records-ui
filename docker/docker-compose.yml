services:
  easy-records-ui:
    image: ezraorina834/easy-records-ui:${APP_VERSION}
    restart: unless-stopped
    networks:
      - ezra-home

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.easy-records-ui-${ENV}.rule=Host(`${HOST}`)"
      - "traefik.http.routers.easy-records-ui-${ENV}.entrypoints=websecure"
      - "traefik.http.routers.easy-records-ui-${ENV}.tls=true"
      - "traefik.http.routers.easy-records-ui-${ENV}.tls.certresolver=acme-cert-resolver"
      - "traefik.http.services.easy-records-ui-${ENV}.loadbalancer.server.port=80"

networks:
  ezra-home:
    external: true
